[build]
  publish = "."
  command = "mkdir -p netlify/functions && cp api.mjs netlify/functions/api.mjs"

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/boshqaruv-*"
  [headers.values]
    X-Robots-Tag = "noindex"
    Cache-Control = "no-store"
